name: droid-control tests

on:
  pull_request:
    paths:
      - 'plugins/droid-control/bin/tctl'
      - 'plugins/droid-control/scripts/render-showcase.sh'
      - 'plugins/droid-control/tests/**'
      - 'plugins/droid-control/fframes/**'
      - '.github/workflows/droid-control-tests.yml'
  push:
    branches: [master]
    paths:
      - 'plugins/droid-control/bin/tctl'
      - 'plugins/droid-control/scripts/render-showcase.sh'
      - 'plugins/droid-control/tests/**'
      - 'plugins/droid-control/fframes/**'
      - '.github/workflows/droid-control-tests.yml'

env:
  PYTHONDONTWRITEBYTECODE: 1
  CARGO_TERM_COLOR: always

jobs:
  showcase:
    name: Showcase composition, render helper, real renders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg, agg, and the fframes build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg clang libclang-dev libx264-dev
          curl -fsSL -o agg https://github.com/asciinema/agg/releases/download/v1.9.0/agg-x86_64-unknown-linux-gnu
          echo "f111e315cd71056b116302342553dd765b7297579ed511f111d0cedb442aeda6  agg" | sha256sum -c -
          sudo install -m 0755 agg /usr/local/bin/agg

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/droid-control/fframes

      - name: Format, lint, and unit tests
        working-directory: plugins/droid-control/fframes
        run: |
          cargo fmt --check
          cargo clippy --all-targets --release -- -D warnings
          cargo test --release

      - name: Helper integration tests and real renders
        run: python3 -m unittest discover -v -s plugins/droid-control/tests -p 'test_*.py'
