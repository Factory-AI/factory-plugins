[package]
name = "droid-showcase"
version = "0.1.0"
edition = "2024"
publish = false
description = "droid-control showcase composition, rendered with fframes"

[dependencies]
clap = { version = "4", features = ["derive"] }
fframes = { version = "=1.2.0", features = ["compile-time-svgtree"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
signal-hook = "0.3"
tempfile = "3"
syntect = { version = "5.3", default-features = false, features = ["parsing", "default-syntaxes", "regex-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }

[lib]
name = "droid_showcase"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "droid-showcase"
path = "src/main.rs"

# A standalone workspace: the plugin repository has no Cargo workspace of its own.
[workspace]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
